name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poetry-tests:
    name: Poetry tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: python -m pip install 'poetry==2.2.1'
      - name: Install project dependencies
        run: poetry install --with dev
      - name: Run tests
        run: poetry run pytest -q

  cloud-dependencies:
    name: Cloud dependencies (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Cloud dependencies and test runner
        run: python -m pip install -r requirements.txt 'pytest>=9.2.0,<10.0.0'
      - name: Verify Kaggle import
        env:
          KAGGLE_USERNAME: test-user
          KAGGLE_KEY: test-key
        run: python -c "from kaggle.api.kaggle_api_extended import KaggleApi; print('Kaggle import succeeded')"
      - name: Run tests with Cloud dependencies
        run: python -m pytest -q
